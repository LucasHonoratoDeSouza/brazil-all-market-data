name: Daily Market Data Update

# Runs every day at 23:30 UTC (20:30 BRT / after both B3 and NYSE close).
# Can also be triggered manually via the "Run workflow" button on GitHub.
on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    # Allow the job to write (commit + push) back to the repository
    permissions:
      contents: write

    steps:
      # ── 1. Checkout with full data history ──────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # fetch-depth 0 ensures the full branch history is available so that
          # git push succeeds without force-push.
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── 3. Incremental data collection ──────────────────────────────────────
      # The collector auto-detects the last date in each CSV and only downloads
      # new rows.  First run → full history from 2000-01-01.
      - name: Collect incremental market data
        run: python main.py --collect

      # ── 4. Re-build derived datasets (returns, summary) ───────────────────
      - name: Mine derived datasets
        run: python main.py --mine

      # ── 5. Validate ─────────────────────────────────────────────────────────
      - name: Validate data
        run: python main.py --validate

      # ── 6. Commit and push updated CSVs ─────────────────────────────────────
      - name: Commit and push updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          # Only commit if there are actual changes (--quiet exits 0 when clean)
          if git diff --cached --quiet; then
            echo "No new data — nothing to commit."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "chore(data): daily update ${TODAY} [skip ci]"
            git push
          fi
